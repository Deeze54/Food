<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lightweight Baby — calories, macros &amp; bodyweight</title>
<meta name="theme-color" content="#0f2a2e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f5f0" media="(prefers-color-scheme: light)">
<meta name="description" content="Log a batch once, then log a cup of it. Calories, macros and bodyweight, built around cooking in bulk.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lightweight">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f2a2e;
    --surface:#16383d;
    --surface-2:#1d454b;
    --line:#2a5f66;
    --line-strong:#3d7d84;
    --chalk:#eef3ef;
    --muted:#93b1b1;
    --placeholder:#6f9296;
    --protein:#ff7a5c;
    --carbs:#f0c04a;
    --fat:#86c46b;
    --fiber:#93b7ea;
    --danger:#ff7a5c;
    --btn-bg:#eef3ef;
    --btn-fg:#0f2a2e;
    --btn-bg-hover:#ffffff;
    --tabbar:rgba(15,42,46,.94);
    --scrim:rgba(6,20,22,.72);
    --r:14px;
    --pad:16px;
    font-synthesis-weight:none;
  }
  /* light palette: same enamel identity, flipped. Follows iOS appearance
     unless the reader forces one in Settings (data-theme on <html>). */
  @media (prefers-color-scheme: light){
    html:not([data-theme=dark]){
      color-scheme:light;
      --bg:#f2f5f0;
      --surface:#ffffff;
      --surface-2:#e8eee9;
      --line:#d2ded6;
      --line-strong:#8fada4;
      --chalk:#123230;
      --muted:#5d7c76;
      --placeholder:#8aa39c;
      --protein:#c8391f;
      --carbs:#9a6c00;
      --fat:#38801f;
      --fiber:#2d6ba8;
      --danger:#c8391f;
      --btn-bg:#123230;
      --btn-fg:#f2f5f0;
      --btn-bg-hover:#0b2422;
      --tabbar:rgba(242,245,240,.94);
      --scrim:rgba(18,50,48,.4);
    }
  }
  html[data-theme=light]{
    color-scheme:light;
    --bg:#f2f5f0;
    --surface:#ffffff;
    --surface-2:#e8eee9;
    --line:#d2ded6;
    --line-strong:#8fada4;
    --chalk:#123230;
    --muted:#5d7c76;
    --placeholder:#8aa39c;
    --protein:#c8391f;
    --carbs:#9a6c00;
    --fat:#38801f;
    --fiber:#2d6ba8;
    --danger:#c8391f;
    --btn-bg:#123230;
    --btn-fg:#f2f5f0;
    --btn-bg-hover:#0b2422;
    --tabbar:rgba(242,245,240,.94);
    --scrim:rgba(18,50,48,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 var(--pad)}
  button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
  button{cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:6px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 0 10px}
  .brand{font-weight:700;letter-spacing:-.02em;font-size:19px}
  .brand span{color:var(--muted);font-weight:500}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:17px}
  .iconbtn:hover{color:var(--chalk);border-color:var(--chalk)}

  .datenav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .datenav .day{font-weight:600;font-size:15px}
  .datenav .sub{color:var(--muted);font-size:13px}
  .nav-arrow{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;line-height:1}
  .nav-arrow[disabled]{opacity:.3;cursor:default}
  .spacer{flex:1}
  .textbtn{color:var(--muted);font-size:13px;border-bottom:1px solid transparent;padding:2px 0}
  .textbtn:hover{color:var(--chalk);border-color:var(--chalk)}

  /* ---------- gauge ---------- */
  .gauge{background:var(--surface);border-radius:var(--r);padding:18px var(--pad) 16px;border:1px solid var(--line)}
  .readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .readout .big{font-size:clamp(46px,15vw,64px);font-weight:700;letter-spacing:-.045em;line-height:.95}
  .readout .unit{font-size:15px;color:var(--muted);font-weight:500}
  .readout.over .big{color:var(--protein)}
  .eaten{color:var(--muted);font-size:13.5px;margin-top:6px}
  .rail{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
  .rail > i{display:block;height:100%;border-radius:99px;background:var(--chalk);transition:width .35s ease}
  .rail.over > i{background:var(--protein)}

  .macros{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;margin-top:16px}
  @media (min-width:480px){.macros{grid-template-columns:repeat(4,1fr)}}
  .macro .head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
  .macro .val{font-weight:600;font-size:15px;color:var(--chalk)}
  .macro .rail{height:5px;margin-top:6px}
  .macro.p .rail > i{background:var(--protein)}
  .macro.c .rail > i{background:var(--carbs)}
  .macro.f .rail > i{background:var(--fat)}
  .macro.fb .rail > i{background:var(--fiber)}

  /* ---------- lists ---------- */
  h2{font-size:14px;font-weight:600;color:var(--muted);margin:26px 0 10px;letter-spacing:0}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:left;width:100%}
  .row:hover{border-color:var(--line-strong)}
  .row .name{font-weight:600;font-size:15.5px;line-height:1.25}
  .row .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .row .grow{flex:1;min-width:0}
  .row .kcal{font-weight:700;font-size:16px;white-space:nowrap}
  .dots{display:flex;gap:4px;margin-top:6px;align-items:center;font-size:12.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:99px;display:inline-block}
  .dot.p{background:var(--protein)}.dot.c{background:var(--carbs)}.dot.f{background:var(--fat)}.dot.fb{background:var(--fiber)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:20px 16px;color:var(--muted);font-size:14.5px}
  .empty b{color:var(--chalk);display:block;font-size:15.5px;margin-bottom:4px;font-weight:600}

  .btn{background:var(--btn-bg);color:var(--btn-fg);font-weight:600;padding:13px 18px;border-radius:12px;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:var(--btn-bg-hover)}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--chalk);background:transparent}
  .btn.small{padding:8px 12px;font-size:13.5px;border-radius:9px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .quick{background:var(--surface-2);color:var(--chalk);border:1px solid var(--line);padding:7px 11px;border-radius:99px;font-size:13px;white-space:nowrap}
  .quick:hover{border-color:var(--chalk)}

  /* ---------- fields ---------- */
  label.field{display:block;margin-bottom:12px}
  label.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=number],input[type=search],select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:16px;color:var(--chalk);appearance:none;-webkit-appearance:none;
  }
  input::placeholder{color:var(--placeholder)}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  input:focus,select:focus{border-color:var(--chalk);outline:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid4 input{padding:11px 8px;text-align:center}

  /* ---------- sheet ---------- */
  .sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
  .sheet-bg.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
    transition:transform .22s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .sheet-head{position:sticky;top:0;background:var(--bg);padding:16px var(--pad) 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);z-index:2}
  .sheet-head h3{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
  .sheet-body{padding:16px var(--pad) 8px;max-width:600px;margin:0 auto}
  @media (prefers-reduced-motion:reduce){.sheet,.rail>i,.bub{transition:none}}

  /* ---------- tabs ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;padding:8px 4px;border-radius:10px;color:var(--muted);font-size:12.5px;font-weight:600;display:grid;gap:3px;justify-items:center}
  .tabs button .ic{font-size:18px;line-height:1}
  .tabs button[aria-selected=true]{color:var(--chalk);background:var(--surface)}

  .ing{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
  .ing:last-child{border-bottom:0}
  .ing .grow{flex:1;min-width:0}
  .ing .g{color:var(--muted);font-size:13px}
  .x{color:var(--muted);font-size:18px;padding:2px 6px;line-height:1}
  .x:hover{color:var(--danger)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel .cap{padding:11px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
  .per{display:flex;align-items:baseline;gap:8px;padding:14px 12px}
  .per .n{font-size:30px;font-weight:700;letter-spacing:-.03em}
  .per .l{color:var(--muted);font-size:13.5px}
  .results{max-height:44vh;overflow-y:auto;margin-top:4px}
  .banner{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .hint{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
  .chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;scrollbar-width:none}
  .chipbar::-webkit-scrollbar{display:none}
  .split{display:flex;gap:8px}
  .split .btn{flex:1}
  .totalline{display:flex;justify-content:space-between;padding:12px;font-size:14px;border-top:1px solid var(--line);color:var(--muted)}
  .totalline b{color:var(--chalk);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
  .stat .n{display:block;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .stat .l{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .stat .n.up{color:var(--protein)}
  .stat .n.down{color:var(--fat)}
  .chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px}
  .chart svg{display:block;width:100%;height:auto}
  .seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--chalk)}
  .cheat{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;margin-bottom:10px;
    border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:14.5px;font-weight:600;text-align:left}
  .cheat .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:12px;color:transparent}
  .cheat .why{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted)}
  .cheat[aria-pressed=true]{border-color:var(--carbs);color:var(--chalk)}
  .cheat[aria-pressed=true] .box{background:var(--carbs);border-color:var(--carbs);color:var(--bg)}
  .cheatdot{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-bottom:7px solid var(--carbs);margin-right:6px;vertical-align:1px}
  .bubbles{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:2px 0 16px}
  .bub{display:grid;justify-items:center;gap:1px;min-width:0;border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.25;
    transition:background-color .18s ease,border-color .18s ease,color .18s ease}
  .bub:hover{border-color:var(--line-strong);color:var(--chalk)}
  .bub .nm{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bub .tg{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
  .bub[aria-pressed=true]{background:var(--surface);border-color:var(--chalk);color:var(--chalk);
    padding:10px 20px;font-size:16.5px;font-weight:700;letter-spacing:-.015em}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Lightweight <span>baby</span></div>
    <button class="iconbtn" data-action="open-settings" aria-label="Settings">⚙</button>

  <div id="storagewarn"></div>

    <button class="iconbtn" data-action="close-sheet" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
</section>

function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

function seedFoods() {
  return SEED.map(function (r) {
    return {
      id: "s-" + slug(r[0]), name: r[0],
      kcal: r[1], p: r[2], c: r[3], f: r[4], fib: r[5] || 0,
      unitName: r[6] || "", unitGrams: r[7] || 0
    };
  });
}

/* One set of targets became several. Older saves keep their numbers as the
   first profile; the second starts as a copy so nothing changes until edited. */
function ensureProfiles() {
  if (!S.dayProfile) S.dayProfile = {};
  if (!S.profiles || !S.profiles.length) {
    var t = S.targets || { kcal: 2000, p: 150, c: 200, f: 65, fib: 30 };
    if (!t.fib) t.fib = 30;
    S.profiles = [
      { id: "hard", name: "Hard training", targets: JSON.parse(JSON.stringify(t)) },
      { id: "soft", name: "Soft training", targets: JSON.parse(JSON.stringify(t)) }
    ];
    S.activeProfile = "hard";
  }
  S.profiles.forEach(function (pr) { if (!pr.targets.fib) pr.targets.fib = 30; });
  if (!byId(S.profiles, S.activeProfile)) S.activeProfile = S.profiles[0].id;
  if (S.targets) { delete S.targets; persist(); }
}
ensureProfiles();
if (!S.weights) S.weights = [];
if (!S.weightUnit) S.weightUnit = "lb";
if (!S.cheatDays) S.cheatDays = {};

/* Add foods that shipped after this save was made. Matching is by name, so
   anything already there (including your own edits) is left alone, and once
   the top-up has run, foods you delete stay deleted. */
function mergeSeedFoods() {
  if (S.seedVersion >= SEED_VERSION) return;
  S.foods = S.foods.filter(function (f) { return f.name !== "Ground beef 85/15, cooked"; });
  var have = {};
  S.foods.forEach(function (f) { have[(f.name || "").toLowerCase()] = 1; });
  seedFoods().forEach(function (f) { if (!have[f.name.toLowerCase()]) S.foods.push(f); });
  S.seedVersion = SEED_VERSION;
  persist();
}
/* Bring older saves up to the current shape, once, on load. */
S.batches.forEach(function (b) {
  (b.items || []).forEach(function (it, i) {
    if (it.foodId !== undefined) {
      // v1: ingredients pointed at the food library and stored grams
      var food = byId(S.foods, it.foodId);
      var m = food ? scale(food, it.grams / 100) : { kcal: 0, p: 0, c: 0, f: 0, fib: 0 };
      it = b.items[i] = {
        name: food ? food.name : "ingredient", qty: it.grams, unit: "g", per: "all",
        kcal: m.kcal, p: m.p, c: m.c, f: m.f, fib: m.fib || 0
      };
    }
    if (it.unit) return;
    // v2: typed totals with a free-text note. Read a weight out of the note if there is one.
    var w = /^\s*([\d.]+)\s*(kg|g|oz|lb)\b/i.exec(it.note || "");
    it.per = "all";
    if (w) {
      it.qty = parseFloat(w[1]) * (w[2].toLowerCase() === "kg" ? 1000 : 1);
      it.unit = w[2].toLowerCase() === "kg" ? "g" : w[2].toLowerCase();
    } else {
      it.qty = 1; it.unit = "item";
    }
  });
  // "cooked weight" used to be the whole batch; it is per portion now
  if (b.portionGrams === undefined) {
    b.portionGrams = b.cookedGrams > 0 && b.yieldQty > 0 ? b.cookedGrams / b.yieldQty : 0;
  }
  delete b.cookedGrams;
});

function uid() { return Math.random().toString(36).slice(2, 9); }
function todayKey() { return dateKey(new Date()); }
function dateKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function shiftDay(key, n) {
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  d.setDate(d.getDate() + n);
  return dateKey(d);
}
function prettyDay(key) {
  if (key === todayKey()) return "Today";
  if (key === shiftDay(todayKey(), -1)) return "Yesterday";
  var p = key.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function r0(n) { return Math.round(n || 0); }
function r1(n) { n = n || 0; return Math.abs(n) < 10 ? Math.round(n * 10) / 10 : Math.round(n); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
function num(v, d) { var n = parseFloat(v); return isNaN(n) ? (d || 0) : n; }
function byName(a, b) { return a.name.localeCompare(b.name); }
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function macroDots(m) {
  var h = '<div class="dots"><span class="dot p"></span>' + r1(m.p) + 'p' +
          '<span class="dot c" style="margin-left:8px"></span>' + r1(m.c) + 'c' +
          '<span class="dot f" style="margin-left:8px"></span>' + r1(m.f) + 'f';
  if ((m.fib || 0) > 0) h += '<span class="dot fb" style="margin-left:8px"></span>' + r1(m.fib) + ' fib';
  return h + '</div>';
}
function scale(src, factor) {
  return {
    kcal: (src.kcal || 0) * factor, p: (src.p || 0) * factor,
    c: (src.c || 0) * factor, f: (src.f || 0) * factor, fib: (src.fib || 0) * factor
  };
}

/* An ingredient stores the numbers exactly as typed, plus how much was used
   and what those numbers describe. Everything else is derived. */
var G_PER = { g: 1, oz: 28.3495, lb: 453.592, item: 0 };

function ingGrams(it) { return (it.qty || 0) * (G_PER[it.unit] || 0); }

function ingFactor(it) {
  var g = ingGrams(it);
  switch (it.per) {
    case "100g": return g / 100;
    case "1g": return g;
    case "1oz": return g / 28.3495;
    case "1lb": return g / 453.592;
    case "1item": return it.qty || 0;
    default: return 1;              // "all" — the numbers are the whole lot
  }
}
function ingTotals(it) { return scale(it, ingFactor(it)); }

function amountLabel(it) {
  if (it.unit === "item") {
    if (it.note && (it.qty || 1) === 1) return it.note;
    return r1(it.qty) + ((it.qty || 0) === 1 ? " item" : " items");
  }
  return r1(it.qty) + " " + it.unit;
}

/* batch maths: add up the ingredients, then divide by the yield */
function batchTotals(b) {
  var t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0 };
  (b.items || []).forEach(function (it) {
    var m = ingTotals(it);
    t.kcal += m.kcal; t.p += m.p; t.c += m.c; t.f += m.f; t.fib += m.fib;
  });
  return t;
}
function batchRawGrams(b) {
  return (b.items || []).reduce(function (a, it) { return a + ingGrams(it); }, 0);
}
function batchPerUnit(b) {
  return scale(batchTotals(b), 1 / (b.yieldQty > 0 ? b.yieldQty : 1));
}
/* grams in one portion, and in the whole batch */
function portionGrams(b) { return b.portionGrams > 0 ? b.portionGrams : 0; }
function cookedGrams(b) { return portionGrams(b) * (b.yieldQty > 0 ? b.yieldQty : 1); }

/* Bodyweight is stored in kg and shown in whatever unit you picked. */
var LB_PER_KG = 2.20462;
function toKg(v) { return S.weightUnit === "lb" ? v / LB_PER_KG : v; }
function fromKg(kg) { return S.weightUnit === "lb" ? kg * LB_PER_KG : kg; }
function wShow(kg) { return (Math.round(fromKg(kg) * 10) / 10).toFixed(1); }

function weightsSorted() {
  return S.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function weightOn(key) {
  for (var i = 0; i < S.weights.length; i++) if (S.weights[i].date === key) return S.weights[i];
  return null;
}
function daysBetween(a, b) {
  var pa = a.split("-"), pb = b.split("-");
  return Math.round((new Date(pb[0], pb[1] - 1, pb[2]) - new Date(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
/* average of everything logged in the 7 days up to and including a date */
function trailingAvg(list, idx, days) {
  var end = list[idx].date, sum = 0, n = 0;
  for (var i = idx; i >= 0; i--) {
    if (daysBetween(list[i].date, end) >= days) break;
    sum += list[i].kg; n++;
  }
  return n ? sum / n : list[idx].kg;
}

/* A cheat day changes no maths. It is a label, so that a spike on the scale or

function isCheat(key) { return !!S.cheatDays[key]; }

/* Any day you touch gets tagged with the profile it was on, even if you never
   tapped a bubble that day. Without this, days you did not switch on would

function stampDay(key) {

}
function cheatNote(key) { return (S.cheatDays[key] && S.cheatDays[key].note) || ""; }

function profileForDay(key) {
  return byId(S.profiles, S.dayProfile[key]) || byId(S.profiles, S.activeProfile) || S.profiles[0];
}
function targetsFor(key) { return profileForDay(key).targets; }

function dayLog(key) { return S.log.filter(function (e) { return e.date === key; }); }
function dayTotals(key) {

    a.kcal += e.kcal || 0; a.p += e.p || 0; a.c += e.c || 0;

function applyTheme() {
  var t = S.theme || "auto";
  var root = document.documentElement;
  if (t === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);

  // keep Safari's toolbar tint in step with a forced theme
  var forced = document.getElementById("forcedtheme");
  if (t === "auto") { if (forced) forced.parentNode.removeChild(forced); return; }
  if (!forced) {
    forced = document.createElement("meta");
    forced.id = "forcedtheme";
    forced.setAttribute("name", "theme-color");
    document.head.insertBefore(forced, document.head.firstChild);
  }
  forced.setAttribute("content", t === "light" ? "#f2f5f0" : "#0f2a2e");
}

var wRange = 90;   // days shown in the chart; 0 = everything

function viewWeight() {
  var all = weightsSorted();
  var u = S.weightUnit;
  var todays = weightOn(todayKey());

  var h = '<div class="seg" style="margin-bottom:14px">' +
      '<button data-action="weight-unit" data-v="lb" aria-pressed="' + (u === "lb") + '">Pounds</button>' +
      '<button data-action="weight-unit" data-v="kg" aria-pressed="' + (u === "kg") + '">Kilograms</button>' +
    '</div>' +
    '<div class="panel"><div class="cap">' + (todays ? "Today, already logged" : "Weigh-in for today") + '</div>' +
    '<div style="padding:12px"><div class="grid2">' +
      '<input type="number" id="wval" step="0.1" inputmode="decimal" aria-label="Weight" value="' +
        (todays ? wShow(todays.kg) : "") + '" placeholder="' + (all.length ? wShow(all[all.length - 1].kg) : "0.0") + '">' +
      '<button class="btn" data-action="save-weight">' + (todays ? "Update" : "Save") + '</button>' +
    '</div></div></div>';

  if (!all.length) {
    view.innerHTML = h + '<div class="empty" style="margin-top:14px"><b>No weigh-ins yet</b>' +
      'Log one a day, same time, same conditions. The seven-day average is the line that matters — daily numbers bounce around by a couple of pounds for reasons that have nothing to do with fat.</div>';
    return;
  }

  // stats
  var last = all[all.length - 1];
  var avgNow = trailingAvg(all, all.length - 1, 7);
  /* compare against the weigh-in closest to a month back, averaged the same way */
  var change = null, span = 0, best = -1, bestGap = 1e9;
  for (var i = all.length - 1; i >= 0; i--) {
    var gap = daysBetween(all[i].date, last.date);
    if (gap >= 21 && Math.abs(gap - 30) < bestGap) { bestGap = Math.abs(gap - 30); best = i; span = gap; }
  }
  if (best > -1) change = avgNow - trailingAvg(all, best, 7);
  h += '<div class="stats">' +
    '<div class="stat"><span class="n">' + wShow(last.kg) + '</span><span class="l">latest, ' + prettyDay(last.date).toLowerCase() + '</span></div>' +
    '<div class="stat"><span class="n">' + wShow(avgNow) + '</span><span class="l">7-day average</span></div>' +
    '<div class="stat"><span class="n' + (change === null ? '' : change > 0 ? ' up' : change < 0 ? ' down' : '') + '">' +
      (change === null ? '—' : (change > 0 ? '+' : '') + (Math.round(fromKg(change) * 10) / 10).toFixed(1)) +
      '</span><span class="l">' + (change === null ? 'need 4 weeks' : 'over ' + span + ' days') + '</span></div>' +
  '</div>';

  // chart
  var pts = all;
  if (wRange > 0) {
    pts = all.filter(function (e) { return daysBetween(e.date, last.date) < wRange; });
    if (pts.length < 2) pts = all.slice(-2);
  }
  var anyFlag = Object.keys(S.cheatDays).some(function (k) {
    return daysBetween(pts[0].date, k) >= 0 && daysBetween(k, last.date) >= 0;
  });
  h += '<div class="chart">' + weightChartSVG(pts) + '</div>' +
    (anyFlag ? '<p class="hint" style="margin-top:8px"><span class="cheatdot"></span>Cheat day. The scale usually catches up a day or two later.</p>' : '') +
    '<div class="chipbar" style="margin-top:10px">' +
      [[30, "30 days"], [90, "90 days"], [0, "All"]].map(function (r) {
        return '<button class="quick" data-action="weight-range" data-v="' + r[0] + '"' +
          (wRange === r[0] ? ' style="border-color:var(--chalk)"' : '') + '>' + r[1] + '</button>';
      }).join("") +
    '</div>';

  h += '<h2>Weigh-ins (' + all.length + ')</h2>';
  all.slice().reverse().slice(0, 40).forEach(function (e, i, arr) {
    var prev = arr[i + 1];
    var diff = prev ? fromKg(e.kg - prev.kg) : null;
    h += '<button class="row" data-action="edit-weight" data-date="' + e.date + '">' +
      '<div class="grow"><div class="name">' + wShow(e.kg) + ' ' + u + '</div>' +
      '<div class="meta">' + (isCheat(e.date) ? '<span class="cheatdot"></span>' : '') +
        prettyDay(e.date) + ' · ' + esc(profileForDay(e.date).name) +
        (cheatNote(e.date) ? ' · ' + esc(cheatNote(e.date)) : '') + '</div></div>' +
      '<div class="kcal" style="color:' + (diff === null ? 'var(--muted)' : diff > 0 ? 'var(--protein)' : diff < 0 ? 'var(--fat)' : 'var(--muted)') + '">' +
        (diff === null ? '' : (diff > 0 ? '+' : '') + (Math.round(diff * 10) / 10).toFixed(1)) + '</div></button>';
  });
  view.innerHTML = h;
}

/* raw weigh-ins as a thin line, the 7-day average as the bold one */
function weightChartSVG(list) {
  var W = 340, H = 170, L = 6, R = 40, T = 14, B = 22;
  if (!list.length) return "";
  var days = daysBetween(list[0].date, list[list.length - 1].date) || 1;
  var avg = list.map(function (e, i) { return trailingAvg(list, i, 7); });
  var vals = list.map(function (e) { return e.kg; }).concat(avg);
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var pad = Math.max((hi - lo) * 0.15, 0.3);
  lo -= pad; hi += pad;

  function x(e) { return L + (daysBetween(list[0].date, e.date) / days) * (W - L - R); }
  function y(v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); }
  function path(getter) {
    return list.map(function (e, i) { return (i ? "L" : "M") + x(e).toFixed(1) + " " + y(getter(e, i)).toFixed(1); }).join(" ");
  }

  var g = '<line x1="' + L + '" y1="' + y(hi - pad) + '" x2="' + (W - R) + '" y2="' + y(hi - pad) + '" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
          '<line x1="' + L + '" y1="' + y(lo + pad) + '" x2="' + (W - R) + '" y2="' + y(lo + pad) + '" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
          '<text x="' + (W - R + 6) + '" y="' + (y(hi - pad) + 4) + '" font-size="11" fill="var(--muted)">' + wShow(hi - pad) + '</text>' +
          '<text x="' + (W - R + 6) + '" y="' + (y(lo + pad) + 4) + '" font-size="11" fill="var(--muted)">' + wShow(lo + pad) + '</text>';

  var raw = '<path d="' + path(function (e) { return e.kg; }) + '" fill="none" stroke="var(--line-strong)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
  var dots = list.map(function (e) {
    return '<circle cx="' + x(e).toFixed(1) + '" cy="' + y(e.kg).toFixed(1) + '" r="2" fill="var(--line-strong)"/>';
  }).join("");
  var mean = '<path d="' + path(function (e, i) { return avg[i]; }) + '" fill="none" stroke="var(--chalk)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';

  var flags = Object.keys(S.cheatDays).filter(function (k) {
    return daysBetween(list[0].date, k) >= 0 && daysBetween(k, list[list.length - 1].date) >= 0;
  }).map(function (k) {
    var px = L + (daysBetween(list[0].date, k) / days) * (W - L - R);
    return '<path d="M' + px.toFixed(1) + ' ' + (H - B + 2) + ' l-3.5 6 h7 z" fill="var(--carbs)"><title>Cheat day ' + k + '</title></path>';
  }).join("");

  var labels = '<text x="' + L + '" y="' + (H - 5) + '" font-size="11" fill="var(--muted)">' + list[0].date.slice(5) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 5) + '" font-size="11" fill="var(--muted)" text-anchor="end">' + list[list.length - 1].date.slice(5) + '</text>';

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weight over time">' +
    g + raw + dots + mean + flags + labels + '</svg>';
}

function renderResults(q) {
  q = (q || "").toLowerCase();
  var h = "";
  var bs = S.batches.filter(function (b) { return b.name.toLowerCase().indexOf(q) > -1; });
  var fs = S.foods.filter(function (f) { return f.name.toLowerCase().indexOf(q) > -1; }).sort(byName).slice(0, 40);
  if (bs.length) {
    h += '<h2 style="margin-top:4px">Batches</h2>';

      h += '<button class="row" data-action="pick" data-kind="batch" data-id="' + b.id + '">' +
        '<div class="grow"><div class="name">' + esc(b.name) + '</div>' +
        '<div class="meta">' + r0(per.kcal) + ' kcal per ' + esc(b.yieldUnit) + '</div></div></button>';
    });
  }
  h += '<h2' + (bs.length ? '' : ' style="margin-top:4px"') + '>Foods</h2>';

    h += '<button class="row" data-action="pick" data-kind="food" data-id="' + f.id + '">' +

      '<div class="meta">' + r0(f.kcal) + ' kcal / 100 g</div></div></button>';
  });

function pick(kind, id) {
  var opts = [], name = "";
  if (kind === "batch") {
    var b = byId(S.batches, id);
    if (!b) return;
    name = b.name;
    var per = batchPerUnit(b);
    var gPer = portionGrams(b);
    opts.push({ label: b.yieldUnit, per: per });
    if (gPer > 0) opts.push({ label: "g", per: scale(per, 1 / gPer) });
    opts.push({ label: "whole batch", per: scale(per, b.yieldQty || 1) });
  } else {
    var f = byId(S.foods, id);
    if (!f) return;
    name = f.name;
    opts.push({ label: "g", per: scale(f, 1 / 100) });
    if (f.unitGrams > 0) {
      opts.push({ label: f.unitName, text: f.unitName + " (" + r1(f.unitGrams) + " g)", per: scale(f, f.unitGrams / 100) });
    }
    opts.push({ label: "oz", per: scale(f, 28.35 / 100) });
  }
  picked = { kind: kind, id: id, name: name, opts: opts };
  var sel = "";
  opts.forEach(function (o, i) { sel += '<option value="' + i + '">' + esc(o.text || o.label) + '</option>'; });
  var defQty = opts[0].label === "g" ? 100 : 1;
  document.getElementById("results").innerHTML = "";
  document.getElementById("q").value = "";
  document.getElementById("amount").innerHTML =
    '<div class="panel" style="margin-bottom:12px"><div class="cap">' + esc(name) + '</div>' +
    '<div style="padding:12px"><div class="grid2">' +
      '<input type="number" id="qty" value="' + defQty + '" step="0.25" inputmode="decimal" aria-label="Amount">' +
      '<select id="unit" aria-label="Unit">' + sel + '</select>' +
    '</div><div id="preview" class="meta" style="color:var(--muted);font-size:13.5px;margin:10px 0 12px"></div>' +
    '<div class="split"><button class="btn ghost" data-action="cancel-pick">Back</button>' +
    '<button class="btn" data-action="confirm-log">Log it</button></div></div></div>';
  var qty = document.getElementById("qty"), unit = document.getElementById("unit");
  function prev() {
    var m = scale(picked.opts[+unit.value].per, num(qty.value));
    document.getElementById("preview").textContent =
      r0(m.kcal) + " kcal · " + r1(m.p) + "p · " + r1(m.c) + "c · " + r1(m.f) + "f" +
      (m.fib > 0 ? " · " + r1(m.fib) + " fib" : "");
  }
  qty.addEventListener("input", prev);
  unit.addEventListener("change", function () {
    qty.value = picked.opts[+unit.value].label === "g" ? 100 : 1;
    prev();
  });
  prev();
  setTimeout(function () { qty.select(); }, 60);
}

function confirmLog() {
  if (!picked) return;
  var qty = num(document.getElementById("qty").value);
  var o = picked.opts[+document.getElementById("unit").value];
  if (qty <= 0) return;
  var m = scale(o.per, qty);
  addEntry(picked.name, r1(qty) + " " + o.label, m);
  closeSheet();
  tab = "today"; render();
}

function addEntry(name, qtyLabel, m) {
  stampDay(day);
  S.log.push({
    id: uid(), date: day, name: name, qtyLabel: qtyLabel,
    kcal: m.kcal, p: m.p, c: m.c, f: m.f, fib: m.fib || 0
  });
  persist();
}

function quickLog(id) {
  var b = byId(S.batches, id);
  if (!b) return;
  addEntry(b.name, "1 " + b.yieldUnit, batchPerUnit(b));
  tab = "today"; render();
}

        '<div class="g">' + esc(amountLabel(it)) + ' · ' + r0(m.kcal) + ' kcal · ' +

        (m.fib > 0 ? ' ' + r1(m.fib) + 'fib' : '') + '</div></div>' +
        '<button class="x" data-action="edit-ing" data-i="' + i + '" aria-label="Edit">✎</button>' +
        '<button class="x" data-action="rm-ing" data-i="' + i + '" aria-label="Remove">✕</button></div>';
    });
    h += '<div class="totalline"><span>Batch total</span><b>' + r0(t.kcal) + ' kcal · ' +
      r0(t.p) + 'p ' + r0(t.c) + 'c ' + r0(t.f) + 'f' + (t.fib > 0 ? ' ' + r0(t.fib) + 'fib' : '') + '</b></div>';
  }
  h += '</div><p class="hint" style="margin-top:8px">Type each ingredient and the numbers off its packet or label. Nothing is looked up for you.</p>' +
    '<button class="btn ghost block" data-action="add-ing">+ Add ingredient</button>';

  h += '<h2>What it made</h2>' +
    '<div class="grid2">' +
      '<label class="field"><span>Amount</span><input type="number" id="byq" value="' + draft.yieldQty + '" step="0.5" inputmode="decimal"></label>' +
      '<label class="field"><span>Unit</span><input type="text" id="byu" value="' + esc(draft.yieldUnit) + '" placeholder="cup"></label>' +
    '</div>' +
    '<label class="field"><span>One ' + esc(draft.yieldUnit || "serving") + ' weighs (optional — this is what lets you log by grams)</span>' +
    '<input type="number" id="bcg" value="' + (draft.portionGrams || "") + '" placeholder="e.g. 250" inputmode="decimal"></label>';

  var raw = batchRawGrams(draft);
  if (raw > 0 && draft.yieldQty > 0) {
    h += '<p class="hint" style="margin-top:-6px">Ingredients weighed ' + r0(raw) + ' g, so ' +
      r0(raw / draft.yieldQty) + ' g per ' + esc(draft.yieldUnit || "serving") + ' before any liquid cooks off. ' +
      '<button class="textbtn" data-action="use-weight" data-g="' + (raw / draft.yieldQty) + '">Use that</button></p>';
  }

  h += '<div class="panel" style="margin-bottom:14px" id="perpanel">' + perPanelHTML() + '</div>';

  h += '<div class="split"><button class="btn block" data-action="save-batch">Save batch</button></div>';
  if (!draft.isNew) h += '<button class="btn danger block" style="margin-top:10px" data-action="del-batch">Delete batch</button>';

  openSheet(draft.isNew ? "New batch" : "Edit batch", h);
  ["bname", "byq", "byu", "bcg"].forEach(function (idd) {
    document.getElementById(idd).addEventListener("input", function () {
      syncDraft();
      document.getElementById("perpanel").innerHTML = perPanelHTML();
    });
  });
}

function perPanelHTML() {
  var per = batchPerUnit(draft), pg = portionGrams(draft);
  var h = '<div class="cap">One ' + esc(draft.yieldUnit || "serving") + (pg > 0 ? ' = ' + r0(pg) + ' g' : '') + '</div>' +
    '<div class="per"><span class="n">' + r0(per.kcal) + '</span><span class="l">kcal · ' +
    r1(per.p) + ' g protein · ' + r1(per.c) + ' g carbs · ' + r1(per.f) + ' g fat' +
    (per.fib > 0 ? ' · ' + r1(per.fib) + ' g fiber' : '') + '</span></div>';
  if (pg > 0) {
    var g100 = scale(per, 100 / pg);
    h += '<div class="totalline"><span>Per 100 g</span><b>' + r0(g100.kcal) + ' kcal · ' +
      r1(g100.p) + 'p ' + r1(g100.c) + 'c ' + r1(g100.f) + 'f' +
      (g100.fib > 0 ? ' ' + r1(g100.fib) + 'fib' : '') + '</b></div>';
  }
  return h;
}

function syncDraft() {
  var n = document.getElementById("bname");
  if (!n) return;
  draft.name = n.value;
  draft.yieldQty = num(document.getElementById("byq").value, 1);
  draft.yieldUnit = document.getElementById("byu").value.trim() || "serving";
  draft.portionGrams = num(document.getElementById("bcg").value, 0);
}

function recentIngredients() {
  var seen = {}, out = [];
  for (var i = 0; i < S.batches.length; i++) {
    var items = S.batches[i].items || [];
    for (var j = items.length - 1; j >= 0; j--) {
      var key = (items[j].name || "").toLowerCase();
      if (!key || seen[key]) continue;
      seen[key] = 1;
      out.push(items[j]);
      if (out.length >= 8) return out;
    }
  }
  return out;
}

/* Ingredients are whatever you type. No built-in list, no lookups: name it,
   say how much went in, and copy the numbers off the packet. */
var UNITS = [["g", "g"], ["oz", "oz"], ["lb", "lb"], ["item", "item(s)"]];

function perOptions(unit, qty) {
  var all = ["all", qty > 1 ? "all " + r1(qty) + " together" : "all of it"];
  if (unit === "item") return [["1item", "each one"], all];
  if (unit === "oz") return [["1oz", "1 oz"], ["100g", "100 g"], all];
  if (unit === "lb") return [["1lb", "1 lb"], ["100g", "100 g"], all];
  return [["100g", "100 g"], ["1g", "1 g"], all];
}

    '<span style="display:block;font-size:13px;color:var(--muted);margin-bottom:5px">Protein · Carbs · Fat · Fiber (grams)</span>' +
    '<div class="grid4">' +
      '<input type="number" id="ip" value="' + it.p + '" placeholder="P" inputmode="decimal" aria-label="Protein">' +

  });
  document.getElementById("iunit").addEventListener("change", function () { buildPerSelect(); });
  document.getElementById("iqty").addEventListener("input", function () { buildPerSelect(document.getElementById("iper").value); });
  ingPreview();
  setTimeout(function () { var n = document.getElementById("iname"); if (n && !n.value) n.focus(); }, 60);

/* the "numbers are for" choices depend on whether you weighed it or counted it */
function buildPerSelect(keep) {
  var unit = document.getElementById("iunit").value;
  var qty = num(document.getElementById("iqty").value);
  var sel = document.getElementById("iper");
  var opts = perOptions(unit, qty);
  var want = keep || sel.value;
  var has = opts.some(function (o) { return o[0] === want; });
  sel.innerHTML = opts.map(function (o) {
    return '<option value="' + o[0] + '"' + ((has ? want === o[0] : o === opts[0]) ? " selected" : "") + '>' + o[1] + '</option>';
  }).join("");
  if (!sel.dataset.bound) {
    sel.dataset.bound = "1";
    sel.addEventListener("change", ingPreview);
  }
  ingPreview();
}

function readIngForm() {
  return {
    name: document.getElementById("iname").value.trim(),
    qty: num(document.getElementById("iqty").value),
    unit: document.getElementById("iunit").value,
    per: document.getElementById("iper").value,
    kcal: num(document.getElementById("ikcal").value),
    p: num(document.getElementById("ip").value),
    c: num(document.getElementById("ic").value),
    f: num(document.getElementById("if").value),
    fib: num(document.getElementById("ifb").value)
  };
}

function ingPreview() {
  var it = readIngForm();
  var m = ingTotals(it);
  var box = document.getElementById("ipreview");
  if (!box) return;
  box.innerHTML = '<div class="cap">' + esc(amountLabel(it) || "this ingredient") + ' adds</div>' +
    '<div class="per"><span class="n">' + r0(m.kcal) + '</span><span class="l">kcal · ' +
    r1(m.p) + 'p · ' + r1(m.c) + 'c · ' + r1(m.f) + 'f' + (m.fib > 0 ? ' · ' + r1(m.fib) + ' fib' : '') + '</span></div>';
}

function reuseIngredient(i) {
  var r = recentIngredients()[i];
  if (!r) return;
  document.getElementById("iname").value = r.name;
  document.getElementById("iqty").value = r1(r.qty);
  document.getElementById("iunit").value = r.unit || "g";
  document.getElementById("ikcal").value = r0(r.kcal);
  document.getElementById("ip").value = r1(r.p);
  document.getElementById("ic").value = r1(r.c);
  document.getElementById("if").value = r1(r.f);
  document.getElementById("ifb").value = r1(r.fib || 0);
  buildPerSelect(r.per);
}

/* Grams always work. This is for the extra unit a food is naturally counted in. */
var UNIT_CHOICES = ["serving", "cup", "tbsp", "tsp", "oz", "slice", "piece", "each",

function unitOptions(current) {
  var list = UNIT_CHOICES.slice();
  if (current && list.indexOf(current) === -1) list.unshift(current);
  var h = '<option value=""' + (current ? "" : " selected") + '>Grams only</option>';
  list.forEach(function (u) {

/* The saved file gets a plain-language tag per day on top of the raw state:
   which profile was selected, and whether it was flagged as a cheat day. */
function exportPayload() {
  var out = JSON.parse(JSON.stringify(S));
  delete out.dayTags;
  var days = {};
  Object.keys(S.dayProfile).forEach(function (k) { days[k] = 1; });
  Object.keys(S.cheatDays).forEach(function (k) { days[k] = 1; });
  S.log.forEach(function (e) { days[e.date] = 1; });
  S.weights.forEach(function (e) { days[e.date] = 1; });
  out.dayTags = {};
  Object.keys(days).sort().forEach(function (k) {
    var w = weightOn(k), t = dayTotals(k);
    out.dayTags[k] = {
      profile: profileForDay(k).name,
      cheatDay: isCheat(k),
      kcal: r0(t.kcal),
      weightKg: w ? Math.round(w.kg * 100) / 100 : null
    };
    if (cheatNote(k)) out.dayTags[k].note = cheatNote(k);
  });
  return out;
}

function doExport() {
  var blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lightweight-baby-" + todayKey() + ".json";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}
function doImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var data = JSON.parse(fr.result);
      if (!data.foods || !data.log) throw new Error("bad file");
      S = data;
      if (!S.theme) S.theme = "auto";
      ensureProfiles();
      if (!S.weights) S.weights = [];
      if (!S.weightUnit) S.weightUnit = "lb";
      if (!S.cheatDays) S.cheatDays = {};
      delete S.dayTags;   // rebuilt on the way out, never read back in
      persist(); applyTheme(); closeSheet(); render();
    } catch (err) {
      alert("That file could not be read. It needs to be an export from this app.");
    }
  };
  fr.readAsText(file);
}

/* ---------------------------------------------------------------
   events
----------------------------------------------------------------*/
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action],[data-tab]");
  if (!el) return;
  var a = el.dataset.action;

  if (el.dataset.tab) { tab = el.dataset.tab; render(); return; }

  switch (a) {
    case "day": day = shiftDay(day, +el.dataset.n); if (day > todayKey()) day = todayKey(); render(); break;
    case "day-today": day = todayKey(); render(); break;
    case "open-add": openAdd(); break;
    case "close-sheet": closeSheet(); break;
    case "pick": pick(el.dataset.kind, el.dataset.id); break;
    case "cancel-pick": openAdd(); break;
    case "confirm-log": confirmLog(); break;
    case "quick-log": quickLog(el.dataset.id); break;
    case "del-entry":
      S.log = S.log.filter(function (x) { return x.id !== el.dataset.id; });
      persist(); render(); break;
    case "manual-log": {
      var kc = num(document.getElementById("mkcal").value);
      var nm = document.getElementById("mname").value.trim() || "Quick entry";
      if (kc <= 0) { document.getElementById("mkcal").focus(); return; }
      addEntry(nm, "entered by hand", {
        kcal: kc,
        p: num(document.getElementById("mp").value),
        c: num(document.getElementById("mc").value),
        f: num(document.getElementById("mf").value),
        fib: num(document.getElementById("mfb").value)
      });
      closeSheet(); tab = "today"; render(); break;
    }
    case "new-batch": openBatch(null); break;
    case "edit-batch": openBatch(el.dataset.id); break;
    case "back-batch": renderBatchSheet(); break;
    case "add-ing": addIngredientUI(); break;
    case "edit-ing": syncDraft(); addIngredientUI(+el.dataset.i); break;
    case "reuse-ing": reuseIngredient(+el.dataset.i); break;
    case "rm-ing": syncDraft(); draft.items.splice(+el.dataset.i, 1); renderBatchSheet(); break;
    case "save-ing": {
      var item = readIngForm();
      if (!item.name) { document.getElementById("iname").focus(); return; }
      if (item.qty <= 0) { document.getElementById("iqty").focus(); return; }
      if (el.dataset.i === "") draft.items.push(item);
      else draft.items[+el.dataset.i] = item;
      renderBatchSheet(); break;
    }
    case "use-weight":
      syncDraft();
      draft.portionGrams = Math.round(+el.dataset.g);
      renderBatchSheet(); break;
    case "save-batch": {
      syncDraft();
      if (!draft.name.trim()) { document.getElementById("bname").focus(); return; }
      var copy = JSON.parse(JSON.stringify(draft));
      delete copy.isNew;
      var ex = byId(S.batches, copy.id);
      if (ex) { for (var k in copy) ex[k] = copy[k]; }
      else S.batches.unshift(copy);
      persist(); closeSheet(); tab = "cook"; render(); break;
    }
    case "del-batch":
      if (confirm("Delete this batch? Meals you already logged from it stay in your history.")) {
        S.batches = S.batches.filter(function (x) { return x.id !== draft.id; });
        persist(); closeSheet(); render();
      }
      break;
    case "new-food": openFood(null, ""); break;
    case "edit-food": openFood(el.dataset.id, ""); break;
    case "save-food": saveFood(el.dataset.id, el.dataset.back); break;
    case "del-food":
      if (confirm("Delete this food? Batches using it will lose that ingredient.")) {
        S.foods = S.foods.filter(function (x) { return x.id !== el.dataset.id; });
        persist(); closeSheet(); render();
      }
      break;
    case "toggle-cheat":
      stampDay(day);
      if (S.cheatDays[day]) delete S.cheatDays[day];
      else S.cheatDays[day] = { note: "" };
      persist(); render(); break;
    case "save-weight":
      if (setWeight(todayKey(), document.getElementById("wval").value)) render();
      else document.getElementById("wval").focus();
      break;
    case "edit-weight": openWeightEntry(el.dataset.date); break;
    case "update-weight": {
      var nd = document.getElementById("wdate").value || el.dataset.date;
      if (nd > todayKey()) nd = todayKey();
      S.weights = S.weights.filter(function (x) { return x.date !== el.dataset.date; });
      if (!setWeight(nd, document.getElementById("wedit").value)) { persist(); }
      closeSheet(); render(); break;
    }
    case "del-weight":
      S.weights = S.weights.filter(function (x) { return x.date !== el.dataset.date; });
      persist(); closeSheet(); render(); break;
    case "weight-unit":
      S.weightUnit = el.dataset.v; persist(); render(); break;
    case "weight-range":
      wRange = +el.dataset.v; render(); break;
    case "open-settings": openSettings(); break;
    case "theme":
      S.theme = el.dataset.v;
      persist(); applyTheme();
      el.parentNode.querySelectorAll("button").forEach(function (b2) {
        b2.setAttribute("aria-pressed", b2.dataset.v === S.theme ? "true" : "false");
      });
      break;
    case "switch-profile":
      S.activeProfile = el.dataset.id;
      S.dayProfile[day] = el.dataset.id;
      persist(); render(); break;
    case "new-profile": openProfile(null); break;
    case "edit-profile": openProfile(el.dataset.id); break;
    case "save-profile": saveProfile(el.dataset.id); break;
    case "del-profile":
      if (S.profiles.length < 2) return;
      if (confirm("Delete this profile? Days that used it fall back to the one in use.")) {
        S.profiles = S.profiles.filter(function (x) { return x.id !== el.dataset.id; });
        if (S.activeProfile === el.dataset.id) S.activeProfile = S.profiles[0].id;
        Object.keys(S.dayProfile).forEach(function (k) {
          if (S.dayProfile[k] === el.dataset.id) delete S.dayProfile[k];
        });
        persist(); render(); openSettings();
      }
      break;
    case "export": doExport(); break;
    case "import": document.getElementById("importfile").click(); break;
    case "reset":
      if (confirm("Erase all batches, foods and logs? This cannot be undone.")) {
        S = {
          theme: S.theme, seedVersion: SEED_VERSION,
          profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)), activeProfile: "hard", dayProfile: {},
          foods: seedFoods(), batches: [], log: [], weights: [], weightUnit: S.weightUnit || "lb", cheatDays: {}
        };
        persist(); closeSheet(); render();
      }
      break;
  }
});

if (!canPersist) {
  document.getElementById("storagewarn").innerHTML =
    '<div class="banner">Preview mode: this frame blocks browser storage, so entries vanish on reload. Once the file is on GitHub Pages, everything saves.</div>';
}

applyTheme();
render();
})();
</script>
</body>
</html>
